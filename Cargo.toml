[package]
name = "zotero"
version = "0.0.6"
edition = "2024"
description = "A command-line client for your Zotero library"
license = "MIT"
repository = "https://github.com/PeterJohannsenCMT/zotero-cli"

[[bin]]
name = "zotero"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
toml = "0.8"
open = "5"
urlencoding = "2"
deunicode = "1"
terminal_size = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "symbols"
